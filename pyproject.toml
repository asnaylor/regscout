[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "regscout"
version = "0.1.0"
description = "Zero-pull container & dependency CVE scanner powered by registry APIs (Harbor, Quay, Docker Scout), GitHub Security Advisories, and cve.now"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Andrew Naylor" }
]
dependencies = []

[project.scripts]
regscout = "regscout.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["regscout*"]
